name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    permissions:
      contents: read
      security-events: write
    uses: builtnorth/.github/.github/workflows/wp-plugin-ci.yml@main
    with:
      # Copy-paste model: PHPUnit across the full supported PHP range ×
      # oldest-supported WP + latest.
      php-versions: '["8.1", "8.2", "8.3", "8.4"]'
      wordpress-versions: '["6.0", "latest"]'
      run-wp-taint: true
    secrets: inherit
