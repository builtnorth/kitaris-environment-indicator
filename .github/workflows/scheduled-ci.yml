name: Scheduled CI

on:
  schedule:
    # Run every Monday at 10:00 AM ET (2:00 PM UTC)
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  scheduled-ci:
    permissions:
      contents: read
      security-events: write
    uses: builtnorth/.github/.github/workflows/wp-plugin-ci.yml@main
    with:
      php-versions: '["8.1", "8.2", "8.3", "8.4"]'
      wordpress-versions: '["6.0", "latest"]'
      run-wp-taint: true
    secrets:
      ORG_REPO_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
